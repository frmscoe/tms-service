name: Deploy TMS Service Helm chart

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'The version of the chart to deploy (e.g., 0.1.0). Required if not a release.'
        required: false

jobs:
  deploy_chart:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    name: Deploy Helm chart to Kubernetes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set ENV variables
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV

      - name: Get chart name
        id: chart_meta
        run: |
          echo "NAME=$(grep '^name:' ./charts/tms-service/Chart.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Determine chart version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION=${{ github.ref_name }}
            echo "VERSION=${VERSION#v}" >> $GITHUB_OUTPUT
          elif [[ -n "${{ github.event.inputs.chart_version }}" ]]; then
            echo "VERSION=${{ github.event.inputs.chart_version }}" >> $GITHUB_OUTPUT
          else
            echo "Chart version is required. Please provide it via input or trigger via a release."
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.8.1

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Decode Kubeconfig
        run: |
          printf '%s' '${{ secrets.KUBE_CONFIG_DATA }}' | base64 --decode > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig

      - name: Verify k8s connection
        env:
          KUBECONFIG: /tmp/kubeconfig
        run: kubectl cluster-info

      - name: Deploy Helm chart
        env:
          KUBECONFIG: /tmp/kubeconfig
        run: |
          helm upgrade --install ${{ env.REPO_NAME }} oci://docker.io/tazamaorg/${{ steps.chart_meta.outputs.NAME }} --version ${{ steps.get_version.outputs.VERSION }} -n processor --create-namespace --atomic --wait=true --timeout=900s --cleanup-on-fail=true

      - name: Resolve source PR
        id: src_pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].html_url // empty' 2>/dev/null || true)
          echo "PR_URL=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Send Slack Notification
        if: always()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SERVICE_NAME: ${{ env.REPO_NAME }} (Deploy)
          CHART_REPOSITORY: oci://docker.io/tazamaorg/${{ steps.chart_meta.outputs.NAME }}:${{ steps.get_version.outputs.VERSION }}
          PR_URL: ${{ steps.src_pr.outputs.PR_URL }}
          JOB_STATUS: ${{ job.status }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && echo "SLACK_WEBHOOK_URL is not configured. Skipping Slack notification." && exit 0
          SHORT_SHA="${COMMIT_SHA:0:7}"
          curl --fail-with-body -sS -X POST -H 'Content-type: application/json' --data "$(jq -n --arg title "$([ "$JOB_STATUS" = "success" ] && echo "Helm Chart deployed successfully :rocket:" || echo "Helm chart deployment failed :x:")" --arg service "$SERVICE_NAME" --arg status "$JOB_STATUS" --arg chart "$CHART_REPOSITORY" --arg version "$DEPLOY_VERSION" --arg branch "$BRANCH_NAME" --arg sha "$SHORT_SHA" --arg pr "$PR_URL" --arg run "$RUN_URL" '{blocks:[{type:"header",text:{type:"plain_text",text:$title,emoji:true}},{type:"section",fields:([{type:"mrkdwn",text:("*Service:*\n"+$service)},{type:"mrkdwn",text:("*Status:*\n"+$status)},{type:"mrkdwn",text:("*Deployed Version:*\n`"+$version+"`")},{type:"mrkdwn",text:("*Chart:*\n`"+$chart+"`")},{type:"mrkdwn",text:("*Branch:*\n`"+$branch+"`")},{type:"mrkdwn",text:("*Commit:*\n`"+$sha+"`")},{type:"mrkdwn",text:("*Workflow Run:*\n<"+$run+"|Open run>")}]+(if $pr != "" then [{type:"mrkdwn",text:("*Source PR:*\n<"+$pr+"|Open PR>")}] else [] end))}]}')" "$SLACK_WEBHOOK_URL"
